[project]
name = "rag-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Superuj1986", email = "dotuanlong2209@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.41.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-lab = "rag_lab:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
